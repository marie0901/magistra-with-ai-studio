steps:
  - name: 'ubuntu'
    args: ['echo', 'Test variable from trigger: ${_TEST_VAR}']
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/magistra-with-ai-studio'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/magistra-with-ai-studio']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'magistra-with-ai-studio'
      - '--image=gcr.io/$PROJECT_ID/magistra-with-ai-studio'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--set-env-vars=VITE_GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY